<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Happy 20th Birthday Asma 💖</title><style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #000, #1a001a);
    color: white;
    text-align: center;
}

section {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

h1 { font-size: 45px; text-shadow: 0 0 20px pink; }

button {
    padding: 14px 30px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(45deg, pink, hotpink);
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.cake {
    font-size: 120px;
    cursor: pointer;
    transition: 0.5s;
}

.cut {
    transform: scale(0.7) rotate(20deg);
    opacity: 0.6;
}

#knife {
    font-size: 60px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    animation: cutAnim 1s forwards;
}

@keyframes cutAnim {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -20%) rotate(45deg); }
}

.heart {
    position: fixed;
    bottom: 0;
    font-size: 20px;
    animation: floatUp 5s linear infinite;
}

@keyframes floatUp {
    from { transform: translateY(0); }
    to { transform: translateY(-100vh); }
}

</style></head><body><!-- IMPORTANT: muted removed, controls hidden --><audio id="song">
    <source src="https://www.bensound.com/bensound-music/bensound-happyrock.mp3" type="audio/mpeg">
</audio><section>
    <h1>Happy 20th Birthday Asma 💖</h1>
    <p>Tap the cake to cut it 🎂</p><div class="cake" id="cake" onclick="cutCake()">🎂</div>
<div id="knife">🔪</div>

<p id="msg"></p>

</section><script>

function cutCake(){
    const cake = document.getElementById("cake");
    const knife = document.getElementById("knife");
    const song = document.getElementById("song");

    cake.classList.add("cut");
    knife.style.display = "block";

    // FIX: ensure play works on user interaction
    song.currentTime = 0;
    song.play().then(() => {
        console.log("Music started");
    }).catch(err => {
        alert("Tap again to play music 🎵");
    });

    document.getElementById("msg").innerHTML = "🎉 Cake Cut! Happy Birthday Asma 💖";

    launchHearts();
}

function launchHearts(){
    setInterval(() => {
        let heart = document.createElement("div");
        heart.innerHTML = "💖";
        heart.className = "heart";
        heart.style.left = Math.random()*100 + "vw";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),5000);
    },300);
}

</script></body>
</html>
